<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Women's Day 8/3 - To Ngọc Anh</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Bảng màu Pastel cực kỳ nhẹ nhàng, kẹo ngọt */
            --pastel-bg: #fdf2f4;
            --pastel-gradient-1: #ffcfd2;
            --pastel-gradient-2: #f1c0e8;
            --text-main: #594a4e;
            --text-light: #8e7c80;
            --card-bg: #ffffff;
            --accent-pink: #f79cba; /* Màu hồng nhấn nhá mềm mại */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Quicksand', sans-serif; /* Phông chữ chính hiện đại, bo tròn */
            background-color: var(--pastel-bg);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            position: relative;
        }

        /* Container cho cánh hoa rơi */
        #petals-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .petal {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.8;
            animation: petalFall linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        @keyframes petalFall {
            0% {
                transform: translate3d(0, -10px, 0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate3d(calc(100px - Math.random() * 200px), 100vh, 0) rotate(720deg);
                opacity: 0;
            }
        }

        #envelope-wrapper {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 600px;
            perspective: 1200px;
            transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        #cover {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Gradient pastel chuyển từ hồng đào sang tím nhẹ */
            background: linear-gradient(135deg, var(--pastel-gradient-1) 0%, var(--pastel-gradient-2) 100%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(241, 192, 232, 0.4); /* Đổ bóng màu pastel */
            border: 4px solid rgba(255, 255, 255, 0.6); /* Viền trắng trong suốt */
            transition: transform 1.5s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.8s ease;
        }

        #cover.hidden {
            transform: translateY(-120%) rotateX(45deg);
            opacity: 0;
            pointer-events: none;
        }

        #cover h1 {
            font-family: 'Dancing Script', cursive; /* Phông chữ viết tay điệu đà */
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            font-size: 3.5rem; /* To hơn một chút cho đẹp */
            margin: 0 0 30px 0;
            letter-spacing: 1px;
        }

        .btn-open {
            background: white;
            color: var(--accent-pink);
            border: none;
            padding: 16px 36px;
            border-radius: 50px; /* Bo tròn hoàn toàn */
            font-family: 'Quicksand', sans-serif;
            font-size: 1.15rem;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(247, 156, 186, 0.3);
            animation: pastelBounce 2s infinite;
            transition: all 0.3s ease;
        }

        .btn-open:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 12px 25px rgba(247, 156, 186, 0.4);
            color: #e88ba9;
        }

        @keyframes pastelBounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-8px);}
            60% {transform: translateY(-4px);}
        }

        .card {
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(241, 192, 232, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.9) translateY(0);
            opacity: 0;
            transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1), opacity 1s ease 0.3s;
            z-index: 10;
        }

        .card.open {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .gallery-container {
            width: 100%;
            height: 65%; /* Giảm một chút để chừa không gian cho text */
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            z-index: 11;
            cursor: grab;
        }

        .gallery-container::-webkit-scrollbar {
            display: none;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            scroll-snap-align: start;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            user-select: none;
            pointer-events: none;
        }

        .content {
            padding: 25px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.98);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .content::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 4px;
            border-radius: 4px;
            background-color: var(--pastel-gradient-1); /* Nét nhấn màu pastel */
        }

        .content h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--accent-pink);
            margin: 10px 0 10px 0;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .content p {
            color: var(--text-main);
            font-size: 1.05rem;
            line-height: 1.5;
            margin: 0;
            font-weight: 500;
        }

        .instruction {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="petals-container"></div>

    <div id="envelope-wrapper">
        <div id="cover">
            <h1>Tặng Cún xinh iu</h1>
            <button class="btn-open" onclick="openCard()">Nhấn vô đây 👉👈</button>
        </div>

        <div class="card" id="mainCard">
            <div class="gallery-container" id="gallery">
                <div class="slide"><img src="anh1.jpg" alt="kỉ niệm Mộc Châu"></div>
                <div class="slide"><img src="anh2.jpg" alt="Vườn cải nắng vàng"></div>
                <div class="slide"><img src="anh3.jpg" alt="Hội An nè"></div>
                <div class="slide"><img src="anh4.jpg" alt="Bọn mình nè"></div>
            </div>
            
            <div class="content">
                <h2>Chúc mừng 8 tháng 3</h2>
                <p>Nhân ngày 8/3 chúc em luôn xinh đẹp, thuận lợi trong công việc và luôn vui vẻ trong cuộc sống nha ❤️</p>
                <div class="instruction">Vuốt sang bên phải nha 🤠</div>
            </div>
        </div>
    </div>

    <script>
        function openCard() {
            document.getElementById('cover').classList.add('hidden');
            document.getElementById('mainCard').classList.add('open');
            
            // Bắt đầu hiệu ứng cánh hoa rơi sau khi mở
            startPetalFall();
        }

        const petalsContainer = document.getElementById('petals-container');
        const totalPetals = 40; 
        const petalEmojis = ['🌸', '🌷', '🎀', '💖', '✨']; // Thêm một vài icon lấp lánh nơ pastel

        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const emoji = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
            petal.textContent = emoji;

            const size = Math.random() * 20 + 10; 
            petal.style.fontSize = `${size}px`;
            petal.style.left = `${Math.random() * 100}%`;
            const fallDuration = Math.random() * 5 + 5; 
            petal.style.animationDuration = `${fallDuration}s`;
            petal.style.opacity = Math.random() * 0.5 + 0.3; 
            
            const randomRotate = Math.random() * 360;
            petal.style.transform += `rotate(${randomRotate}deg)`;

            petalsContainer.appendChild(petal);

            petal.addEventListener('animationend', function() {
                petal.remove();
            });
        }

        function startPetalFall() {
            for (let i = 0; i < 10; i++) {
                createPetal();
            }
            setInterval(() => {
                if (petalsContainer.childElementCount < totalPetals) {
                    createPetal();
                }
            }, 300); 
        }

        const gallery = document.getElementById('gallery');
        let isDragging = false;
        let startX;
        let scrollLeft;

        gallery.addEventListener('mousedown', (e) => {
            isDragging = true;
            gallery.classList.add('active');
            startX = e.pageX - gallery.offsetLeft;
            scrollLeft = gallery.scrollLeft;
            gallery.style.cursor = 'grabbing';
        });
        gallery.addEventListener('mouseleave', () => {
            isDragging = false;
            gallery.classList.remove('active');
            gallery.style.cursor = 'grab';
        });
        gallery.addEventListener('mouseup', () => {
            isDragging = false;
            gallery.classList.remove('active');
            gallery.style.cursor = 'grab';
        });
        gallery.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.pageX - gallery.offsetLeft;
            const walk = (x - startX) * 2; 
            gallery.scrollLeft = scrollLeft - walk;
        });
    </script>
</body>
</html>
